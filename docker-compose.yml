services:
  karaoke:
    build: .
    container_name: karaoke-bot
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    env_file:
      - .env
    environment:
      YTDLP_PLAYER_CLIENT: mweb
      YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
      PIPED_API_URLS: ${PIPED_API_URLS-https://pipedapi.kavin.rocks,https://pipedapi.leptons.xyz,https://pipedapi.nosebs.ru,https://pipedapi-libre.kavin.rocks,https://piped-api.privacy.com.de,https://pipedapi.adminforge.de,https://api.piped.yt}
    ports:
      - "127.0.0.1:${HOST_PORT:-3010}:3000"
    volumes:
      - karaoke-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    container_name: karaoke-pot-provider
    restart: unless-stopped
    init: true
    expose:
      - "4416"

volumes:
  karaoke-data:
