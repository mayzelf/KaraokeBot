services:
  karaoke:
    build: .
    container_name: karaoke-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3010}:3000"
    volumes:
      - karaoke-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  karaoke-data:
